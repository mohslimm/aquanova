<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#8c6d32" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00838f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle subtle -->
  <circle cx="50" cy="50" r="46" fill="#0a0a14" stroke="#c5a059" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Droplet outline -->
  <path d="M50 15 C50 15 24 48 24 66 C24 80.3 35.7 92 50 92 C64.3 92 76 80.3 76 66 C76 48 50 15 50 15 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Inner geometric chevrons representing engineering & architecture -->
  <path d="M50 32 L34 56 L38 59 L50 41 L62 59 L66 56 Z" fill="url(#cyanGrad)" opacity="0.9" filter="url(#glow)"/>
  <path d="M50 48 L35 70 L40 73 L50 58 L60 73 L65 70 Z" fill="url(#goldGrad)"/>
  <path d="M50 64 L40 79 L45 81 L50 74 L55 81 L60 79 Z" fill="url(#goldGrad)" opacity="0.75"/>
</svg>
